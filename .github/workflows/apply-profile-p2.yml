name: Apply staged profile p2 patch

on:
  push:
    branches:
      - feat/profile-id-p2-hex-migration
    paths:
      - ".github/patches/profile-p2-*.b64"
      - ".github/workflows/apply-profile-p2.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true

      - name: Apply verified source patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/patches/profile-p2-*.b64 | base64 --decode | gzip -d > /tmp/profile-p2.patch
          git apply --check /tmp/profile-p2.patch
          git apply /tmp/profile-p2.patch
          rm -f .github/patches/profile-p2-*.b64
          rm -f .github/workflows/apply-profile-p2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat(profile): normalize identities and migrate p1 partitions to p2-hex"
          git push origin "HEAD:${GITHUB_REF_NAME}"
