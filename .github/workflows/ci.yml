name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # CI-01 / P0-05: kalite kapısı güvenlik denetiminden bağımsız çalışır; biri
  # kırmızı olduğunda diğerinin sonucu görünmez olmaz.
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run test:taste
      - run: npm run build

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7

  # P0-05: BLOKLAYICI kapı. Üretim bağımlılıklarında high/critical bulgu varsa
  # PR kırmızı olur; kalite işinin sonucu yine ayrı görünür.
  security:
    name: Production dependency audit (blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - name: Production audit (high / critical)
        run: npm audit --omit=dev --audit-level=high

  # Orta/düşük bulgular görünürlük için raporlanır ama PR'ı bloklamaz.
  # Kabul edilen istisnalar: docs/SECURITY-AUDIT.md
  audit-report:
    name: Full dependency audit (informational)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate

  # P0-06: Dev bağımlılıkları çıkarılmış gerçek üretim sunucusu açılıyor mu?
  production:
    name: Production server smoke
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22.18.0'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Prune dev dependencies
        run: npm prune --omit=dev
      - name: Start production server
        env:
          NODE_ENV: production
          PORT: '8799'
          CINETRACK_GITHUB_SYNC: 'off'
        run: |
          mkdir -p /tmp/cinesmoke
          nohup npm start > /tmp/cinesmoke/server.log 2>&1 &
          echo $! > /tmp/cinesmoke/server.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8799/api/health >/dev/null 2>&1; then
              echo "server ready after ${i} attempts"
              exit 0
            fi
            sleep 1
          done
          echo "server did not become ready"
          cat /tmp/cinesmoke/server.log
          exit 1
      - name: Verify API, SPA and SQLite capability
        run: |
          curl -fsS http://127.0.0.1:8799/api/health | grep -q '"ok":true'
          curl -fsS http://127.0.0.1:8799/api/tmdb-status > /dev/null
          curl -fsS http://127.0.0.1:8799/api/archive/sqlite/status | tee /tmp/cinesmoke/archive-status.json
          grep -q '"available":true' /tmp/cinesmoke/archive-status.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/)" = "200"
          # SPA deep link sunucudan index.html dönmeli.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/list)" = "200"
          # Bilinmeyen API rotası HTML döndürmemeli.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/api/does-not-exist)" = "404"
      - name: Graceful shutdown (SIGTERM)
        run: |
          PID="$(cat /tmp/cinesmoke/server.pid)"
          kill -TERM "$PID"
          for i in $(seq 1 30); do
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "server exited cleanly after ${i} checks"
              exit 0
            fi
            sleep 1
          done
          echo "server did not exit within 30s"
          cat /tmp/cinesmoke/server.log
          kill -9 "$PID" 2>/dev/null || true
          exit 1
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: production-smoke-log
          path: /tmp/cinesmoke/server.log
          retention-days: 7
